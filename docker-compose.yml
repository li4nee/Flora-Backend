services:
  postgres:
    image: postgres:17-alpine
    container_name: flora-postgres
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER : ${POSTGRES_USER}
      POSTGRES_PASSWORD : ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS : "--encoding=UTF8 --data-checksums"
    ports:
      - "5433:5432" # external:internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flora"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - flora-network
    restart: unless-stopped

  api:
    build: .
    container_name: flora-api
    command: npm run start:dev
    env_file:
      - .env.docker
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - flora-network
    restart: unless-stopped
    
volumes:
  postgres_data:
    driver: local
networks:
  flora-network:
    driver: bridge